services:

  # =========================================================================
  # 1. RabbitMQ (Message Broker) + Web Management Dashboard
  # =========================================================================
  finvault-rabbitmq:
    # Official RabbitMQ image with management plugin pre-installed
    image: rabbitmq:3-management
    # Container name for easy identification within Docker
    container_name: finvault-rabbitmq
    # Port mapping: "host_port:container_port"
    ports:
      - "5672:5672"   # AMQP default port for .NET application communication (MassTransit)
      - "15672:15672" # HTTP port to access the management UI via Browser (http://localhost:15672)
    # Environment variables to configure default broker credentials
    environment:
      RABBITMQ_DEFAULT_USER: guest  # Default username for login and API connection
      RABBITMQ_DEFAULT_PASS: guest  # Default password for the username above
    # Persist broker data (queues, messages, exchanges) to a Docker volume
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Attach this container to the shared internal network
    networks:
      - finvault-network

  # =========================================================================
  # 2. SQL Server (Database for Current Account / Payroll)
  # =========================================================================
  finvault-sqlserver:
    # Official Microsoft SQL Server 2022 image (latest stable release)
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Container name for easy identification within Docker
    container_name: finvault-sqlserver
    # Map the default SQL Server port to the host machine for SSMS or EF Core connection
    ports:
      - "1433:1433"   # Port 1433 exposed locally on localhost
    # Required environment variables for SQL Server initialization
    environment:
      ACCEPT_EULA: "Y"                              # Accept the End User License Agreement (Required)
      MSSQL_SA_PASSWORD: "V@ult_Matrix_Crypto_99!" # System Administrator ('sa') password
    # Map the data directory to persist .mdf and .ldf database files on host storage
    volumes:
      - sqlserver_data:/var/opt/mssql
    # Attach SQL Server to the shared internal network
    networks:
      finvault-network:
        aliases:
          - sqlserver-host
    # Establish proactive health monitoring to verify SQL Server engine readiness before unblocking dependants
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "V@ult_Matrix_Crypto_99!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # =========================================================================
  # 3. Oracle Database Free (Database for Savings / Pension Plans)
  # =========================================================================
  finvault-oracle:
    # Official Oracle Database Free edition optimized for development
    image: gvenzl/oracle-free:latest
    # Container name for easy identification within Docker
    container_name: finvault-oracle
    # Map the default Oracle port for external connections (DBeaver, SQL Developer, EF Core)
    ports:
      - "1521:1521"   # Port 1521 exposed locally on localhost
    # Environment variables to automatically bootstrap the application user on startup
    environment:
      APP_USER: finvault_user                      # Custom application schema/user to be created
      ORACLE_PASSWORD: "V@ult_M@ster_P@55w.rd!"    # Master password for system accounts (SYS, SYSTEM)
      APP_USER_PASSWORD: "V@ult_Matrix_Crypto_99!" # Password required for the custom 'APP_USER'
    # Map the internal data directory to persist Oracle database files on host storage
    volumes:
      - oracle_data:/opt/oracle/oradata
    # Attach Oracle to the shared internal network
    networks:
      finvault-network:
        aliases:
          - oracle-host

  # =========================================================================
  # 4. CurrentAccount Backend Microservice Container Service (.NET 9)
  # =========================================================================
  currentaccount-service:
    image: gclopes1978/finvault-currentaccount:latest
    container_name: finvault-currentaccount-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.CurrentAccount/Dockerfile
    ports:
      - "7001:8080" # Maps local external gateway HTTP traffic into default .NET Linux container runtime ports
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver-host;Database=FinVaultCurrentAccountDb;User Id=sa;Password=V@ult_Matrix_Crypto_99!;Encrypt=False;
    networks:
      - finvault-network
    # Restrict service bootstrap orchestration sequences until backing data layer targets report healthy operational status
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

# =========================================================================
# Global Volumes Section: Named volumes used by the services above
# Ensures database and broker state persist across container lifecycles
# =========================================================================
volumes:
  rabbitmq_data:   # Managed Docker volume for RabbitMQ state
  sqlserver_data:  # Managed Docker volume for SQL Server files
  oracle_data:     # Managed Docker volume for Oracle database files

# =========================================================================
# Global Networks Section: Isolated virtual network
# Allows containers to discover and communicate with each other using service names
# =========================================================================
networks:
  finvault-network:
    driver: bridge # Standard bridge driver for local single-host networking