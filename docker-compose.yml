services:
  database-migrator:
    container_name: finvault-database-migrator
    build:
      context: .
      dockerfile: src/tools/Gclopes.FinVault.DatabaseMigrator/Dockerfile
    env_file:
      - .env
    environment:
      ConnectionStrings__Identity: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_IDENTITY};User Id=${DB_USER_MIGRATOR};Password=${DB_PASSWORD_MIGRATOR};TrustServerCertificate=True"
      ConnectionStrings__CurrentAccount: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_CURRENTACCOUNT};User Id=${DB_USER_MIGRATOR};Password=${DB_PASSWORD_MIGRATOR};TrustServerCertificate=True"
      ConnectionStrings__Investments: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_INVESTMENTS};User Id=${DB_USER_MIGRATOR};Password=${DB_PASSWORD_MIGRATOR};TrustServerCertificate=True"
      ConnectionStrings__PensionPlans: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_PENSIONPLANS};User Id=${DB_USER_MIGRATOR};Password=${DB_PASSWORD_MIGRATOR};TrustServerCertificate=True"
      ConnectionStrings__SavingsCertificates: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_SAVINGSCERTIFICATES};User Id=${DB_USER_MIGRATOR};Password=${DB_PASSWORD_MIGRATOR};TrustServerCertificate=True"
      ConnectionStrings__DocumentIngestion: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_DOCUMENTINGESTION};User Id=${DB_USER_MIGRATOR};Password=${DB_PASSWORD_MIGRATOR};TrustServerCertificate=True"
      Logging__LogLevel__Default: Information
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    networks:
      - finvault-network
  
  document-ingestion:
    build:
      context: ./src/services/Gclopes.FinVault.DocumentIngestion
      dockerfile: Dockerfile
    container_name: document-ingestion
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "7050:8080" # Maps local port 7050 to the .NET 10 container port 8080
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JwtSettings__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      JwtSettings__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      JwtSettings__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      StorageSettings__Path: /app/uploadPdf
      ConnectionStrings__DefaultConnection: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_DOCUMENTINGESTION};User Id=${DB_USER_DOCUMENTINGESTION};Password=${DB_PASSWORD_DOCUMENTINGESTION};TrustServerCertificate=True"
    volumes:
      - ./data/uploads:/app/uploadPdf
    depends_on:
      finvault-rabbitmq:
        condition: service_healthy
      finvault-sqlserver:
        condition: service_healthy
    networks:
      - finvault-network

  finvault-gateway:
    build:
      context: ./src/gateways/Gclopes.FinVault.Gateway
      dockerfile: Dockerfile
    container_name: finvault-gateway
    ports:
      - "5000:8080" # Maps public port 5000 to Gateway's .NET 10 port 8080
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JwtSettings__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      JwtSettings__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      JwtSettings__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
    depends_on:
      - document-ingestion
      - investments-service
      - currentaccount-service
      - pensionplans-service
      - identity-service
    networks:
      - finvault-network

  finvault-rabbitmq:
    image: rabbitmq:3-management
    container_name: finvault-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    command: >
      sh -c "echo 'vm_memory_high_watermark.relative = 0.99' > /etc/rabbitmq/rabbitmq.conf &&
             echo 'disk_free_limit.absolute = 50MB' >> /etc/rabbitmq/rabbitmq.conf &&
             echo 'listeners.tcp.default = 5672' >> /etc/rabbitmq/rabbitmq.conf &&
             rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - finvault-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  finvault-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finvault-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      finvault-network:
        aliases:
          - sqlserver-host
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  currentaccount-service:
    image: finvault-currentaccount:latest
    container_name: finvault-currentaccount-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.CurrentAccount/Dockerfile
    ports:
      - "7001:8080"
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_CURRENTACCOUNT};User Id=${DB_USER_CURRENTACCOUNT};Password=${DB_PASSWORD_CURRENTACCOUNT};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Gclopes.FinVault.CurrentAccount: Debug
    networks:
      finvault-network:
        aliases:
          - currentaccount-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  identity-service:
    container_name: finvault-identity-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.Identity/Dockerfile
    ports:
      - "7008:8080"
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_IDENTITY};User Id=${DB_USER_IDENTITY};Password=${DB_PASSWORD_IDENTITY};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
    networks:
      finvault-network:
        aliases:
          - identity-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  investments-service:
    container_name: finvault-investments-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.Investments/Dockerfile
    ports:
      - "7005:8080"
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_INVESTMENTS};User Id=${DB_USER_INVESTMENTS};Password=${DB_PASSWORD_INVESTMENTS};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    networks:
      finvault-network:
        aliases:
          - investments-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  pensionplans-service:
    image: finvault-pensionplans:latest
    container_name: finvault-pensionplans-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.PensionPlans/Dockerfile
    ports:
      - "7006:8080"
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_PENSIONPLANS};User Id=${DB_USER_PENSIONPLANS};Password=${DB_PASSWORD_PENSIONPLANS};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    networks:
      finvault-network:
        aliases:
          - pensionplans-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  pdf-parser-service:
    container_name: finvault-pdf-parser
    build:
      context: ./src/services/Gclopes.FinVault.PdfParser
      dockerfile: Dockerfile
    networks:
      finvault-network:
        aliases:
          - pdf-parser
    ports:
      - "7003:8080"
    env_file:
      - .env
    environment:
      - RABBITMQ_ENABLED=${RABBITMQ_ENABLED}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - DOCUMENT_INGESTION_SERVICE_URL=${DOCUMENT_INGESTION_SERVICE_URL}
    depends_on:
      finvault-rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  savings-bonds-service:
    container_name: finvault-savings-bonds-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.SavingsCertificates/Dockerfile
    ports:
      - "7007:8080"
    env_file:
      - .env
    environment:
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${SQLSERVER_HOST},${SQLSERVER_PORT};Database=${DB_NAME_SAVINGSCERTIFICATES};User Id=${DB_USER_SAVINGSCERTIFICATES};Password=${DB_PASSWORD_SAVINGSCERTIFICATES};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    networks:
      finvault-network:
        aliases:
          - savings-bonds-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure
  market-prices-service:
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.MarketPrices/Dockerfile
    container_name: market-prices-service
    ports:
      - "7012:8080"
    env_file:
      - .env  # Isto força o Docker a ler este ficheiro para este serviço
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    networks:
      finvault-network:
        aliases:
          - market-prices-service
    restart: on-failure

volumes:
  rabbitmq_data:
  sqlserver_data:

networks:
  finvault-network:
    name: finvault-network
    driver: bridge
