services:
  document-ingestion:
    build:
      context: ./src/services/Gclopes.FinVault.DocumentIngestion
      dockerfile: Dockerfile
    container_name: document-ingestion
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "7050:8080" # Maps local port 7050 to the .NET 9 container port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - StorageSettings__Path=/app/uploadPdf
    volumes:
      - ./data/uploads:/app/uploadPdf
    depends_on:
      - finvault-rabbitmq
    networks:
      - finvault-network

  finvault-gateway:
    build:
      context: ./src/gateways/Gclopes.FinVault.Gateway
      dockerfile: Dockerfile
    container_name: finvault-gateway
    ports:
      - "5000:8080" # Maps public port 5000 to Gateway's .NET 9 port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - document-ingestion
      - investments-service
      - currentaccount-service
      - pensionplans-service
    networks:
      - finvault-network

  finvault-rabbitmq:
    image: rabbitmq:3-management
    container_name: finvault-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      finvault-network:
        aliases:
          - rabbitmq-host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  finvault-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finvault-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      finvault-network:
        aliases:
          - sqlserver-host
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  finvault-oracle:
    image: gvenzl/oracle-free:latest
    container_name: finvault-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      finvault-network:
        aliases:
          - oracle-host
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  currentaccount-service:
    image: finvault-currentaccount:latest
    container_name: finvault-currentaccount-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.CurrentAccount/Dockerfile
    ports:
      - "7001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${SQLSERVER_CONNECTION_CURRENTACCOUNT}
    networks:
      finvault-network:
        aliases:
          - currentaccount-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  investments-service:
    container_name: finvault-investments-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.Investments/Dockerfile
    ports:
      - "7005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${SQLSERVER_CONNECTION_INVESTMENTS}
    networks:
      finvault-network:
        aliases:
          - investments-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  pensionplans-service:
    image: finvault-pensionplans:latest
    container_name: finvault-pensionplans-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.PensionPlans/Dockerfile
    ports:
      - "7006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${SQLSERVER_CONNECTION_PENSIONPLANS}
    networks:
      finvault-network:
        aliases:
          - pensionplans-api
    depends_on:
      finvault-sqlserver:
        condition: service_healthy
    restart: on-failure

  payrollanalysis-service:
    container_name: finvault-payrollanalysis-api
    build:
      context: .
      dockerfile: src/services/Gclopes.FinVault.PayrollAnalysis/Dockerfile
    ports:
      - "7002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${ORACLE_CONNECTION_PAYROLL}
    networks:
      finvault-network:
        aliases:
          - payrollanalysis-api
    depends_on:
      finvault-oracle:
        condition: service_healthy
    restart: on-failure

  pdf-parser-service:
    container_name: finvault-pdf-parser
    build:
      context: ./src/services/Gclopes.FinVault.PdfParser
      dockerfile: Dockerfile
    # Set the network to enable communication with other microservices
    networks:
      finvault-network:
        aliases:
          - pdf-parser
    ports:
      - "7003:8080" # Maps local port 7003 to the .
    environment:
      - ENABLE_RABBITMQ=${RABBITMQ_ENABLED}
      # These variables will automatically pull values from your .env file
      - CURRENTACCOUNT_SERVICE_URL=${CURRENTACCOUNT_SERVICE_URL}
      - PAYROLL_SERVICE_URL=${PAYROLL_SERVICE_URL}
      - PENSION_INSURANCE_SERVICE_URL=${PENSION_INSURANCE_SERVICE_URL}
      - PENSION_FUND_SERVICE_URL=${PENSION_FUND_SERVICE_URL}
      # URL for RabbitMQ if the parser uses an event-driven approach
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      finvault-rabbitmq:
        condition: service_healthy
      payrollanalysis-service:
        condition: service_started
      currentaccount-service:
        condition: service_started
      pensionplans-service:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq_data:
  sqlserver_data:
  oracle_data:

networks:
  finvault-network:
    name: finvault-network
    driver: bridge
