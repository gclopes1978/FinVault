<div class="chart-panel">
  <div class="chart-header">
    <h2>Evolução de Custos e Proveitos</h2>
    <p>Consulte a evolução mensal (ou diária, ao escolher um mês) dos créditos e débitos.</p>
  </div>

  @if (availableYears.length === 0) {
    <div class="chart-empty-state">
      <p>Sem movimentos suficientes para gerar o gráfico.</p>
    </div>
  } @else {
    <div class="chart-controls">
      <div class="control-group">
        <label for="yearSelect">Ano:</label>
        <select id="yearSelect" [(ngModel)]="selectedYear" (change)="onYearChange()" class="control-select">
          @for (year of availableYears; track year) {
            <option [ngValue]="year">{{ year }}</option>
          }
        </select>
      </div>

      <div class="control-group">
        <label for="monthSelect">Mês:</label>
        <select id="monthSelect" [(ngModel)]="selectedMonth" (change)="onMonthChange()" class="control-select">
          <option [ngValue]="null">Ano completo</option>
          @for (month of monthOptions; track month.value) {
            <option [ngValue]="month.value">{{ month.label }}</option>
          }
        </select>
      </div>
    </div>

    <div class="chart-canvas-wrapper">
      <canvas #chartCanvas></canvas>
    </div>
  }
</div>
