<aside class="app-sidebar">
  <nav class="sidebar-nav">
    <ul>
      @for (item of navItems; track item.label) {
        <li>
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
          >
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
